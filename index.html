<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Portfolio | Shivam Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        window.onerror = function (msg, src, ling, col, error) {
            var d = document.createElement("div");
            d.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100px;background:red;color:white;z-index:99999;font-size:14px;overflow:auto;padding:10px;";
            d.textContent = "Global Error: " + msg + " at " + src + ":" + ling + ":" + col + "\n" + (error ? error.stack : "");
            document.body.appendChild(d);
        };
    </script>
</head>

<body data-theme="light">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>

</html>
